version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 1
    pull-request-branch-name:
      separator: "/"
    reviewers:
      - "nkonko"
    groups:
      dependencies:
        dependency-type: "all"
        update-types:
          - "minor"
          - "patch"
      major-dependencies:
        dependency-type: "all"
        update-types:
          - "major"

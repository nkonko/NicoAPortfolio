<nav class="navbar is-primary" role="navigation" aria-label="main navigation">
  <div class="navbar-brand">
    <a class="navbar-item" routerLink="home">
      <img class="image is-32x32" src="../../../../../../assets/images/logo.png" width="40">
    </a>

    <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="true" data-target="navMenu">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </a>
  </div>

  <div class="navbar-menu" id="navMenu">
    <div class="navbar-start">
      <a class="navbar-item" routerLink="home" [routerLinkActive]="'selected'"
        [routerLinkActiveOptions]="{ exact: true }">
        <strong class="shadow">
          {{ "nav.home" | transloco }}
        </strong>
      </a>
      <a class="navbar-item" routerLink="about" [routerLinkActive]="'selected'"
        [routerLinkActiveOptions]="{ exact: true }">
        <strong class="shadow">
          {{ "nav.about" | transloco }}
        </strong>
      </a>
      <a class="navbar-item" routerLink="skills" [routerLinkActive]="'selected'"
        [routerLinkActiveOptions]="{ exact: true }">
        <strong class="shadow">
          {{ "nav.skills" | transloco }}
        </strong>
      </a>

      <a class="navbar-item" routerLink="experience" [routerLinkActive]="'selected'"
        [routerLinkActiveOptions]="{ exact: true }">
        <strong class="shadow has-tooltip-arrow has-tooltip-bottom" [attr.data-tooltip]="'nav.experienceTooltip' | transloco">
          {{ "nav.experience" | transloco }}
        </strong>
      </a>
      <a class="navbar-item" routerLink="repos" [routerLinkActive]="'selected'"
        [routerLinkActiveOptions]="{ exact: true }">
        <strong class="shadow">
          {{ "nav.repos" | transloco }}
        </strong>
      </a>
    </div>
    <div class="navbar-end">
      <a class="navbar-item theme-toggle" (click)="toggleTheme()" [title]="'nav.themeToggle' | transloco">
        <i class="fas" [ngClass]="theme === 'light' ? 'fa-moon' : 'fa-sun'"></i>
      </a>
      <a class="navbar-item lang-toggle" (click)="toggleLang()" [title]="'nav.languageToggle' | transloco">
        <strong>{{ currentLang() === 'en' ? 'ES' : 'EN' }}</strong>
      </a>
    </div>
  </div>
</nav>

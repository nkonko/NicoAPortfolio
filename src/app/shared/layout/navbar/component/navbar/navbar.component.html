<nav class="navbar is-primary" role="navigation" aria-label="main navigation">
  <div class="navbar-brand">
    <a class="navbar-item" routerLink="home" aria-label="Go to home">
      <img class="image is-32x32" src="../../../../../../assets/images/logo.png" width="40" alt="Logo">
    </a>

    <a role="button" class="navbar-burger" aria-label="Toggle menu" data-target="navMenu">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </a>
  </div>

  <div class="navbar-menu" id="navMenu">
    <div class="navbar-start">
      <a class="navbar-item" routerLink="home" [routerLinkActive]="'selected'"
        [routerLinkActiveOptions]="{ exact: true }">
        {{ "nav.home" | transloco }}
      </a>
      <a class="navbar-item" routerLink="about" [routerLinkActive]="'selected'"
        [routerLinkActiveOptions]="{ exact: true }">
        {{ "nav.about" | transloco }}
      </a>
      <a class="navbar-item" routerLink="skills" [routerLinkActive]="'selected'"
        [routerLinkActiveOptions]="{ exact: true }">
        {{ "nav.skills" | transloco }}
      </a>
      <a class="navbar-item" routerLink="experience" [routerLinkActive]="'selected'"
        [routerLinkActiveOptions]="{ exact: true }"
        class="navbar-item has-tooltip-arrow has-tooltip-bottom"
        [attr.data-tooltip]="'nav.experienceTooltip' | transloco">
        {{ "nav.experience" | transloco }}
      </a>
      <a class="navbar-item" routerLink="repos" [routerLinkActive]="'selected'"
        [routerLinkActiveOptions]="{ exact: true }">
        {{ "nav.repos" | transloco }}
      </a>
    </div>
    <div class="navbar-end">
      <button class="navbar-item theme-toggle" (click)="toggleTheme()"
        [attr.aria-label]="'nav.themeToggle' | transloco"
        [title]="'nav.themeToggle' | transloco">
        <i class="fas" [ngClass]="theme === 'light' ? 'fa-moon' : 'fa-sun'" aria-hidden="true"></i>
      </button>
      <button class="navbar-item lang-toggle" (click)="toggleLang()"
        [attr.aria-label]="'nav.languageToggle' | transloco"
        [title]="'nav.languageToggle' | transloco">
        <span class="lang-flag" aria-hidden="true">{{ currentLang() === 'en' ? '🇦🇷' : '🇺🇸' }}</span>
        <span class="lang-label">{{ currentLang() === 'en' ? 'ES' : 'EN' }}</span>
      </button>
    </div>
  </div>
</nav>

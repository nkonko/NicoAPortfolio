<section class="hero bg is-medium is-bold">
  <div class="hero-body">
      <h1 class="title is-1">
        {{ "home.greeting" | transloco: { name: name() } }}
      </h1>

      <h1 class="title is-4">{{ "jobTitle" | transloco: { label: jobLabel() } }}</h1>
    <div class="custom-card">
      <div class="card-content">
        <div class="content">

          <h4 class="word-carousel">
            <span>
              {{ "home.specialized" | transloco: { years: yearsOfExperience() } }}
            </span>
            <br>
              <br>

                <div class="box">
                  <div class="marquee">
                    <ul class="marquee__content">
                      @for (skill of completeSkills(); track skill.name) {
                        <li class="marquee__item pl-4">
                          @if (skill.icon) {
                            <span class="icon-text">
                              <span class="icon">
                                <i class="{{skill.icon}}" style="font-size: x-large;"></i>
                              </span>
                            </span>
                          }
                          <span>
                            {{skill.name}}
                          </span>
                        </li>
                      }
                    </ul>
                  </div>
                </div>
              </h4>
            </div>
          </div>
        </div>
      </div>
    </section>
